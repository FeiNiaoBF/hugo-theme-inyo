{{- /* render-table.html — 宽表格内部横向滚动（保留表头/表体/对齐/属性） */ -}}
<div class="table-scroll">
  <table{{ range $k, $v := .Attributes }}{{ if $v }}{{ printf " %s=%q" $k $v | safeHTMLAttr }}{{ end }}{{ end }}>
    {{ with .THead }}
    <thead>
      {{ range . }}
      <tr>
        {{ range . }}
        <th{{ with .Alignment }}{{ printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}{{ end }}>{{ .Text | safeHTML }}</th>
        {{ end }}
      </tr>
      {{ end }}
    </thead>
    {{ end }}
    <tbody>
      {{ range .TBody }}
      <tr>
        {{ range . }}
        <td{{ with .Alignment }}{{ printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}{{ end }}>{{ .Text | safeHTML }}</td>
        {{ end }}
      </tr>
      {{ end }}
    </tbody>
  </table>
</div>
