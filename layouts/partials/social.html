{{ if site.Params.social }}
<p class="rail-social">
  {{ range site.Params.social }}
  {{ $isInternal := and (hasPrefix .url "/") (not (hasPrefix .url "//")) }}
  <a href="{{ .url }}"{{ if not $isInternal }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .name }}</a>
  {{ end }}
</p>
{{ end }}
