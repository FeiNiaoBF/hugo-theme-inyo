{{ if hugo.IsMultilingual }}
<nav class="lang" aria-label="{{ i18n "language" | default "Language" }}">
  {{ range .Translations }}
  <a href="{{ .RelPermalink }}" lang="{{ .Language.Lang }}" hreflang="{{ .Language.Lang }}">{{ .Language.Label }}</a>
  {{ end }}
  <span class="lang-current">{{ .Language.Label }}</span>
</nav>
{{ end }}
