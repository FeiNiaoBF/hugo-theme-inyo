baseURL: "https://example.com/"
title: "Inyo 陰陽"
defaultContentLanguage: "zh-cn"

languages:
  zh-cn:
    contentDir: "content/zh-cn"
    label: "中文"
    locale: "zh-CN"
    weight: 1
    title: "Inyo 陰陽"
  en:
    contentDir: "content/en"
    label: "English"
    locale: "en-US"
    weight: 2
    title: "Inyo"
  ja:
    contentDir: "content/ja"
    label: "日本語"
    locale: "ja-JP"
    weight: 3
    title: "Inyo"

module:
  imports:
    - path: "github.com/FeiNiaoBF/hugo-theme-inyo"

params:
  description: "Inyo 是一个以纸墨、阴阳和中文阅读体验为核心的 Hugo 主题。"
  subtitle: "纸墨二元 · 落字有间"
  author: "Inyo"
  font: "wenkai"
  webfonts: true
  math: false
  mainSections:
    - "posts"
  ogImage: "img/seal-yang-og.png"

  taxonomy:
    tag: "tags"

  navigation:
    tags: "tags"
    about: "about"
    archives: "archives"

  heroPoetry:
    api:
      enabled: true
      endpoint: "https://poetry.palemoky.com/api/poems/random"
      lang: "zh-Hans"

  social:
    - name: "GitHub"
      url: "https://github.com/FeiNiaoBF/hugo-theme-inyo"
    - name: "RSS"
      url: "/index.xml"

markup:
  _merge: "deep"
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true

taxonomies:
  category: "categories"
  tag: "tags"
