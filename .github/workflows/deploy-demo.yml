name: Deploy Inyo demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.164.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build example site
        shell: bash
        run: |
          hugo --source exampleSite \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --minify \
            --printPathWarnings

      - name: Verify generated demo
        shell: bash
        run: |
          test -f exampleSite/public/index.html
          grep -q "${{ steps.pages.outputs.base_url }}" exampleSite/public/index.html
          test -n "$(find exampleSite/public/css -maxdepth 1 -name 'main*.css' -print -quit)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: exampleSite/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
