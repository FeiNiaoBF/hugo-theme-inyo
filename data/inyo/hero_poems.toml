[[poems]]
text = "行到水穷处，坐看云起时。"
source = "王维《终南别业》"

[[poems]]
text = "明月松间照，清泉石上流。"
source = "王维《山居秋暝》"

[[poems]]
text = "海内存知己，天涯若比邻。"
source = "王勃《送杜少府之任蜀州》"

[[poems]]
text = "采菊东篱下，悠然见南山。"
source = "陶渊明《饮酒·其五》"

[[poems]]
text = "山光悦鸟性，潭影空人心。"
source = "常建《题破山寺后禅院》"

[[poems]]
text = "欲穷千里目，更上一层楼。"
source = "王之涣《登鹳雀楼》"

[[poems]]
text = "不畏浮云遮望眼，自缘身在最高层。"
source = "王安石《登飞来峰》"

[[poems]]
text = "竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。"
source = "苏轼《定风波·莫听穿林打叶声》"
